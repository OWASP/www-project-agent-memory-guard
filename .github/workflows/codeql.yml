name: CodeQL

# NEW FILE. OpenSSF Scorecard currently scores SAST 0/10 ("SAST tool is not run
# on all commits"). Adding CodeQL on every push and PR moves that check to 10
# and is the single largest one-file gain available on the Scorecard.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC — catches newly published queries

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-extended adds the injection and deserialization queries that
          # matter most for a library that parses untrusted memory content.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
