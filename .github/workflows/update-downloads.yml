name: Update Download Stats Daily

on:
  schedule:
    - cron: "30 0 * * *"  # Run daily at 00:30 UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: TEMP diagnostic — traffic API vs stored gist history
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones" > /tmp/traffic.json
          curl -fsSL "https://gist.githubusercontent.com/vgudur-dev/c04e12f68c363625faf12faaf03a03ca/raw/clone.json" > /tmp/gist.json
          python3 - <<'PY'
          import json
          t = json.load(open("/tmp/traffic.json"))
          g = json.load(open("/tmp/gist.json"))
          print(f"TRAFFIC API (last 14d): count={t['count']} uniques={t['uniques']} entries={len(t['clones'])}")
          for e in t["clones"]:
              print(f"    {e['timestamp']}  count={e['count']:<5} uniques={e['uniques']}")
          print(f"GIST: count={g['count']} uniques={g['uniques']} entries={len(g['clones'])}")
          print("    newest stored entries:")
          for e in g["clones"][-6:]:
              print(f"    {e['timestamp']}  count={e['count']:<5} uniques={e['uniques']}")
          stored = {e["timestamp"] for e in g["clones"]}
          missing = [e for e in t["clones"] if e["timestamp"] not in stored]
          print(f"TRAFFIC ENTRIES NOT YET IN GIST: {len(missing)}")
          for e in missing:
              print(f"    MISSING {e['timestamp']}  count={e['count']}")
          PY

      - name: Fetch download counts
        id: downloads
        run: |
          set -euo pipefail

          # pepy's default badge (static.pepy.tech/badge/<project>) renders an
          # abbreviated value such as "6k", which pinned the PyPI figure at exactly
          # 6000 for weeks regardless of the real count. The personalized badge with
          # units=none renders the full integer, so the total tracks reality instead
          # of jumping a thousand at a time.
          cat > /tmp/parse_downloads.py <<'PY'
          import re
          import sys

          path, project = sys.argv[1], sys.argv[2]
          with open(path) as f:
              svg = f.read()

          labels = [label.strip() for label in re.findall(r">([^<]+)</text>", svg)]
          exact = [label for label in labels if re.fullmatch(r"[0-9][0-9,]*", label)]
          if not exact:
              sys.exit(
                  f"{project}: pepy returned no plain integer download count "
                  f"(labels seen: {labels}). An abbreviated value like '6k' would "
                  f"silently under-report the total, so this is treated as a failure. "
                  f"Check whether the personalized-badge units=none endpoint changed."
              )
          print(int(exact[-1].replace(",", "")))
          PY

          fetch_downloads() {
            project="$1"
            svg="/tmp/${project}-downloads.svg"
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://static.pepy.tech/personalized-badge/${project}?period=total&units=none&left_text=downloads&left_color=grey&right_color=blue" \
              -o "$svg"
            python3 /tmp/parse_downloads.py "$svg" "$project"
          }

          AMG=$(fetch_downloads agent-memory-guard)
          LANGCHAIN=$(fetch_downloads langchain-agent-memory-guard)

          # Clone count from the gist maintained by clone.yml
          CLONES=$(curl -fsSL --retry 3 --retry-delay 5 \
            "https://gist.githubusercontent.com/vgudur-dev/c04e12f68c363625faf12faaf03a03ca/raw/clone.json" \
            | python3 -c "import json,sys; print(int(json.load(sys.stdin)['count']))")

          TOTAL=$((AMG + LANGCHAIN + CLONES))
          echo "amg=$AMG" >> $GITHUB_OUTPUT
          echo "langchain=$LANGCHAIN" >> $GITHUB_OUTPUT
          echo "clones=$CLONES" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total: $TOTAL (AMG PyPI: $AMG, LangChain PyPI: $LANGCHAIN, Clones: $CLONES)"

      - name: Update README with latest total
        run: |
          set -euo pipefail
          TOTAL=${{ steps.downloads.outputs.total }}
          DISPLAY=$(python3 -c "print(f'{$TOTAL:,}+')")
          # Every component is an all-time count, so the total can only grow. A drop
          # means a source failed to parse — or that the README was hand-edited to a
          # number above what the sources actually report. Either way, publishing it
          # would be wrong, so stop and say so.
          CURRENT=$(grep -o '### 📦 [0-9][0-9,]*+ total downloads' README.md | grep -o '[0-9][0-9,]*' | head -1 | tr -d ',')
          if [ -n "$CURRENT" ] && [ "$TOTAL" -lt "$CURRENT" ]; then
            echo "::error::Computed total ($TOTAL) is below the published count ($CURRENT). Either a download source failed to parse, or README.md was hand-edited above the real total — not updating README."
            exit 1
          fi
          sed -i "s/### 📦 [0-9,]*+ total downloads/### 📦 $DISPLAY total downloads/" README.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update download stats [skip ci]"
            git push
          fi
