name: Update Download Stats Daily

on:
  schedule:
    # 30 minutes after clone.yml, which runs at 12:00 UTC — see the note there
    # about GitHub publishing each day's clone totals well after midnight UTC.
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch download counts
        id: downloads
        run: |
          set -euo pipefail

          # pepy's default badge (static.pepy.tech/badge/<project>) renders an
          # abbreviated value such as "6k", which pinned the PyPI figure at exactly
          # 6000 for weeks regardless of the real count. The personalized badge with
          # units=none renders the full integer, so the total tracks reality instead
          # of jumping a thousand at a time.
          cat > /tmp/parse_downloads.py <<'PY'
          import re
          import sys

          path, project = sys.argv[1], sys.argv[2]
          with open(path) as f:
              svg = f.read()

          labels = [label.strip() for label in re.findall(r">([^<]+)</text>", svg)]
          exact = [label for label in labels if re.fullmatch(r"[0-9][0-9,]*", label)]
          if not exact:
              sys.exit(
                  f"{project}: pepy returned no plain integer download count "
                  f"(labels seen: {labels}). An abbreviated value like '6k' would "
                  f"silently under-report the total, so this is treated as a failure. "
                  f"Check whether the personalized-badge units=none endpoint changed."
              )
          print(int(exact[-1].replace(",", "")))
          PY

          fetch_downloads() {
            project="$1"
            svg="/tmp/${project}-downloads.svg"
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://static.pepy.tech/personalized-badge/${project}?period=total&units=none&left_text=downloads&left_color=grey&right_color=blue" \
              -o "$svg"
            python3 /tmp/parse_downloads.py "$svg" "$project"
          }

          AMG=$(fetch_downloads agent-memory-guard)
          LANGCHAIN=$(fetch_downloads langchain-agent-memory-guard)

          # Clone count from the gist maintained by clone.yml
          CLONES=$(curl -fsSL --retry 3 --retry-delay 5 \
            "https://gist.githubusercontent.com/vgudur-dev/c04e12f68c363625faf12faaf03a03ca/raw/clone.json" \
            | python3 -c "import json,sys; print(int(json.load(sys.stdin)['count']))")

          echo "amg=$AMG" >> $GITHUB_OUTPUT
          echo "langchain=$LANGCHAIN" >> $GITHUB_OUTPUT
          echo "clones=$CLONES" >> $GITHUB_OUTPUT
          echo "PyPI: $AMG core + $LANGCHAIN langchain = $((AMG + LANGCHAIN)) installs; clones: $CLONES (not installs)"

      - name: Update the README figures
        run: |
          set -euo pipefail
          AMG=${{ steps.downloads.outputs.amg }}
          LANGCHAIN=${{ steps.downloads.outputs.langchain }}
          CLONES=${{ steps.downloads.outputs.clones }}
          PYPI=$((AMG + LANGCHAIN))

          # The README heading reports installs and clones as two separate figures:
          #   ### 📦 7,699 PyPI downloads · 9,465 repository clones
          # An earlier version of this step looked for "N+ total downloads", which has
          # not existed in the README since the figures were split. The pattern simply
          # stopped matching, sed silently changed nothing, and the step reported
          # "No changes to commit" on every run - so the published numbers froze while
          # the workflow went on looking healthy. The guard below exists so that a
          # non-matching pattern fails loudly instead of quietly freezing the figures.
          if ! grep -qE '^### 📦 [0-9,]+ PyPI downloads · [0-9,]+ repository clones' README.md; then
            echo "::error::The README adoption heading does not match the expected format. Expected a line like '### 📦 7,699 PyPI downloads · 9,465 repository clones'. Refusing to guess - fix the heading or this step."
            exit 1
          fi

          # Both are all-time counts, so neither can legitimately fall. A drop means a
          # source failed to parse, or the README was hand-edited above what the
          # sources report.
          CUR_PYPI=$(grep -oE '^### 📦 [0-9,]+ PyPI' README.md | grep -oE '[0-9,]+' | tr -d ',')
          if [ -n "${CUR_PYPI:-}" ] && [ "$PYPI" -lt "$CUR_PYPI" ]; then
            echo "::error::Computed PyPI total ($PYPI) is below the published figure ($CUR_PYPI). A source failed to parse, or the README was hand-edited above the real total - not updating."
            exit 1
          fi

          PYPI_D=$(python3 -c "print(f'{$PYPI:,}')")
          CLONES_D=$(python3 -c "print(f'{$CLONES:,}')")
          sed -i -E "s/^### 📦 [0-9,]+ PyPI downloads · [0-9,]+ repository clones/### 📦 $PYPI_D PyPI downloads · $CLONES_D repository clones/" README.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update download stats [skip ci]"
            git push
          fi
