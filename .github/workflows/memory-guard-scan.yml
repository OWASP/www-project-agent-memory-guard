name: Agent Memory Guard Scan

# CHANGED: added an explicit top-level permissions block. Without one, this
# workflow inherits the repository default, which OpenSSF Scorecard scores as
# excessive token permissions. Nothing here writes to the repo.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  memory-guard-scan:
    runs-on: ubuntu-latest
    name: Scan for memory poisoning vectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.11'

      # CHANGED: install the version under test, not the last release from PyPI.
      # As written, this workflow ran the published package against the PR — so a
      # PR that broke the guard would still pass. It only ever proved that PyPI
      # was reachable.
      - name: Install agent-memory-guard from the working tree
        run: pip install -e .

      - name: Scan this repository with its own scanner
        run: |
          python -m scanner.scan \
            --path src \
            --policy strict \
            --fail-on high \
            --output text
